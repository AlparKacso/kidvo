name: Report a problem
description: Something is broken, unsafe or not OK for kids. We look at these first.
labels: ["report"]
body:
  - type: input
    id: app
    attributes:
      label: Which app?
      placeholder: "apps/..."
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong?
    validations:
      required: true
