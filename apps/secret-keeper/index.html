<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://kidvo.eu data: blob:; script-src 'self' https://kidvo.eu 'unsafe-inline'; style-src 'self' https://kidvo.eu 'unsafe-inline'; img-src 'self' https://kidvo.eu data: blob:; media-src 'self' https://kidvo.eu data: blob:; font-src 'self' https://kidvo.eu data:; connect-src 'self' https://kidvo.eu; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Keeper</title>
<script src="../../shell/sdk.js"></script>
<script src="lang/en.js"></script>
<script src="lang/hu.js"></script>
<script src="lang/ro.js"></script>
<style>
  :root { --bg: #fff3f6; --ink: #191833; --sunny: #ffe27a; --sunny-edge: #f2b705; --me: #ffffff; --good: #c6f3e3; --bad: #ffd6e0; --sun: #ffd23f;
          --soft: #6b5a68; --pink: #ff8fab; --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; --sans: system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); display: flex; flex-direction: column; position: relative; }
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 2px solid var(--ink); background: #fff; }
  .face { width: 38px; height: 38px; border-radius: 50%; background: var(--sunny); border: 2px solid var(--ink); position: relative; flex: none; }
  .face::before, .face::after { content: ""; position: absolute; top: 12px; width: 5px; height: 7px; border-radius: 3px; background: var(--ink); }
  .face::before { left: 10px; } .face::after { right: 10px; }
  .face i { position: absolute; left: 10px; right: 10px; bottom: 7px; height: 8px; border: 2.5px solid var(--ink); border-top: 0; border-radius: 0 0 12px 12px; }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 16px; }
  .who small { color: var(--soft); font: 700 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  .meta { text-align: right; font: 700 12px/1.3 var(--mono); font-variant-numeric: tabular-nums; }
  .shields { display: flex; gap: 3px; justify-content: flex-end; margin-top: 3px; }
  .shield { width: 14px; height: 16px; background: var(--pink); border: 2px solid var(--ink); border-radius: 2px 2px 8px 8px; }
  .shield.lost { background: transparent; border-style: dashed; }
  .chat { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 9px 12px; border: 2px solid var(--ink); border-radius: 14px; animation: in .18s ease-out; }
  .msg.sunny { align-self: flex-start; background: var(--sunny); border-bottom-left-radius: 3px; }
  .msg.me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 3px; font-weight: 600; }
  .coach { align-self: flex-end; max-width: 82%; margin-top: -4px; padding: 8px 11px; border: 2px dashed var(--ink); background: var(--good); font-size: 14px; animation: in .18s ease-out; }
  .coach.bad { background: var(--bad); }
  .coach.grey { background: var(--sun); }
  .coach b { display: block; font: 800 12px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .05em; }
  .typing { align-self: flex-start; padding: 8px 12px; background: var(--sunny); border: 2px solid var(--ink); border-radius: 14px; letter-spacing: 3px; font-weight: 800; }
  @keyframes in { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  .replies { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px 12px; border-top: 2px solid var(--ink); background: #fff; min-height: 58px; }
  .reply { flex: 1 1 140px; padding: 10px 12px; font: 700 14px/1.25 var(--sans); color: var(--ink); background: #fff; border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; text-align: left; }
  .reply:hover { background: var(--sunny); }
  .reply:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .reply:focus-visible, .btn:focus-visible, footer button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  footer { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0 8px; padding: 6px 12px; color: var(--soft); font: 11px var(--mono); background: #fff; border-top: 1px solid #f0d6de; }
  /* The links stay together on the right and never break mid-label; on a narrow screen "best" takes its own line. */
  footer .links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0 12px; margin-left: auto; }
  footer button { font: 700 11px var(--mono); background: none; border: 0; color: var(--soft); text-decoration: underline; cursor: pointer; padding: 0; white-space: nowrap; text-align: right; }
  footer button:disabled { opacity: .5; text-decoration: none; cursor: default; }
  .card-wrap { position: absolute; inset: 0; display: flex; background: rgba(255, 243, 246, .9); padding: 14px; z-index: 5; overflow-y: auto; }
  .card { margin: auto; width: min(100%, 380px); background: #fff; border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 16px; display: grid; gap: 10px; }
  .card:focus, .replies:focus { outline: none; }
  .card h2 { margin: 0; font: 800 19px/1.2 var(--mono); }
  .card p { margin: 0; }
  .note { color: var(--soft); font-size: 13.5px; }
  .btn { font: 800 13px/1.2 var(--mono); padding: 10px 14px; background: var(--sunny); color: var(--ink); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; text-align: left; }
  .btn.alt { background: #fff; }
  .btn small { display: block; font: 600 12px var(--sans); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat { display: flex; justify-content: space-between; font: 700 13px var(--mono); }
  .earned { display: flex; flex-wrap: wrap; gap: 6px; }
  .earned span { font: 800 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .05em; padding: 5px 7px; border: 2px solid var(--ink); background: var(--good); }
  .rule { padding: 9px 11px; background: var(--sunny); border: 2px solid var(--ink); font-weight: 700; }
  @media (max-width: 420px) { .msg, .coach { max-width: 90%; } .who small { font-size: 9.5px; } }
  @media (max-height: 480px) {
    .top { padding: 6px 10px; } .face { width: 30px; height: 30px; } .face::before, .face::after { top: 9px; } .face::before { left: 7px; } .face::after { right: 7px; } .face i { left: 7px; right: 7px; bottom: 5px; }
    .who small { display: none; } .chat { padding: 8px 10px; gap: 7px; } .replies { padding: 6px 10px 8px; } .reply { flex-basis: 120px; padding: 8px 10px; }
  }
  @media (pointer: coarse) { .reply { min-height: 48px; font-size: 15px; } .btn { padding: 13px 16px; } footer button { padding: 10px 0; } }
  @media (prefers-reduced-motion: reduce) { .msg, .coach { animation: none; } }
</style>
</head>
<body>
  <div class="top">
    <span class="face" aria-hidden="true"><i></i></span>
    <span class="who"><b>Sunny</b><small id="label"></small></span>
    <span class="meta"><span id="progress"></span><span class="shields" id="shields"></span></span>
  </div>
  <main class="chat" id="chat" aria-live="polite"></main>
  <div class="replies" id="replies"></div>
  <footer><span id="best"></span><span class="links"><button type="button" id="change-band"></button><button type="button" id="reset"></button></span></footer>
  <div class="card-wrap" id="overlay" hidden></div>

<script>
(() => {
  const t = (k, v) => kidvo.t(k, v);
  const $ = id => document.getElementById(id);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, reduced ? 0 : ms));
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // What Sunny asks, by kind:
  //   secret  private information: keep it or ask a grown-up; sharing loses a shield.
  //   reward  Sunny offers something for private information; sharing loses a shield and the reward never comes.
  //   graded  a name: the first name is fine, the full name loses a shield.
  //   grey    something a family decides (city, age): asking a grown-up is best; sharing loses no shield.
  //   safe    fine to share, fine to keep.
  // In the Investigators mode Sunny pushes back once on some refusals, to practise saying no twice.
  const POOL = {
    explorers: { ages: '7–9', secrets: ['name', 'address', 'school', 'password', 'phone', 'homealone', 'parentnames'], pick: 5,
                 safe: ['color', 'animal', 'game', 'food', 'superpower'], safePick: 3, rewards: [], graded: [], grey: [], push: [] },
    investigators: { ages: '10–13', secrets: ['petname', 'location', 'birthday', 'photo', 'parentphone', 'bestfriend', 'homealone'], pick: 4,
                     safe: ['book', 'catsdogs', 'build'], safePick: 3, rewards: ['email', 'prize'], graded: ['callname'], grey: ['city', 'age'],
                     push: ['petname', 'bestfriend'] }
  };
  // The ids of the last round, so the next one prefers questions the child has not seen yet.
  let seen = new Set();
  const draw = (ids, n) => [...shuffle(ids.filter(id => !seen.has(id))), ...shuffle(ids.filter(id => seen.has(id)))].slice(0, n);

  let band = null, round = [], i = 0, shields = 0, total = 0, kept = 0, grownup = 0, firm = 0, best = 0;
  let rewardKept = false, rewardShared = null;
  let overlayView = null;
  // Bumped by start(). Every async step keeps the token it started with and stops after its next await
  // if a new round began meanwhile (changing the band or playing again while Sunny was typing).
  let roundId = 0;
  const busy = yes => { $('change-band').disabled = yes; };
  // The reply options on screen, in the order they were drawn, so a language switch can redraw them.
  // Each option carries a label function: the text is looked up when the button is drawn, not when it is offered.
  let currentReplies = null;
  let resetArmed = false, resetTimer = null;

  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const scroll = () => { $('chat').scrollTop = $('chat').scrollHeight; };

  function renderTop() {
    $('label').textContent = t('label');
    $('progress').textContent = band && round.length ? t('progress', { n: Math.min(i + 1, round.length), total: round.length }) : '';
    const box = $('shields');
    box.replaceChildren();
    box.setAttribute('aria-label', t('shieldsAria', { n: shields }));
    for (let k = 0; k < total; k++) box.append(el('span', 'shield' + (k >= shields ? ' lost' : '')));
  }
  function renderFooter() {
    $('best').textContent = best ? t('best', { n: best }) : '';
    $('change-band').textContent = band ? t('playingAs', { band: t('band_' + band), ages: POOL[band].ages }) : '';
    $('reset').textContent = t(resetArmed ? 'resetConfirm' : 'reset');
  }

  // Chat lines are written from text keys and remembered, so a language switch can redraw the whole chat.
  let lines = [];
  function line(node, draw) { draw(); lines.push(draw); $('chat').append(node); scroll(); }
  async function sunnySays(key) {
    const token = roundId;
    const dots = el('div', 'typing', '...');
    $('chat').append(dots); scroll();
    await wait(650);
    dots.remove();
    if (token !== roundId) return;
    const n = el('div', 'msg sunny');
    line(n, () => { n.textContent = t(key); });
  }
  function meSays(key) { const n = el('div', 'msg me'); line(n, () => { n.textContent = t(key); }); }
  // tone: 'good' (green), 'bad' (pink, a shield was lost) or 'grey' (yellow, fine this time but ask first).
  function coach(tone, titleKey, textKey) {
    const c = el('div', 'coach' + (tone === 'good' ? '' : ' ' + tone));
    line(c, () => c.replaceChildren(el('b', null, t(titleKey)), document.createTextNode(t(textKey))));
  }
  function drawReplies() {
    const box = $('replies');
    box.replaceChildren();
    for (const o of currentReplies || []) {
      const b = el('button', 'reply', o.label());
      b.type = 'button';
      b.addEventListener('click', () => { clearReplies(); busy(true); o.pick(); });
      box.append(b);
    }
    // The buttons make the reply bar taller and the chat shorter, so the last message would hide under them.
    scroll();
  }
  function replies(options) {
    currentReplies = options;
    drawReplies();
    busy(false);
    // Focus the reply box, not its first button: the order is shuffled and a highlighted answer nudges the child.
    $('replies').tabIndex = -1; $('replies').focus({ preventScroll: true });
  }
  function clearReplies() { currentReplies = null; $('replies').replaceChildren(); }

  function start() {
    const token = ++roundId;
    clearReplies();
    busy(true);
    const p = POOL[band];
    const secrets = draw(p.secrets, p.pick);
    // At least one question where Sunny pushes back. The last drawn one is the most likely to be a repeat.
    if (p.push.length && !secrets.some(id => p.push.includes(id))) secrets[secrets.length - 1] = draw(p.push, 1)[0];
    const as = kind => id => ({ id, kind });
    round = shuffle([
      ...secrets.map(as('secret')),
      ...draw(p.rewards, 1).map(as('reward')),
      ...p.graded.map(as('graded')),
      ...draw(p.grey, 1).map(as('grey')),
      ...draw(p.safe, p.safePick).map(as('safe'))
    ]);
    seen = new Set(round.map(r => r.id));
    // Shields count the questions that can lose one.
    i = 0; total = round.filter(r => r.kind !== 'safe' && r.kind !== 'grey').length; shields = total;
    kept = 0; grownup = 0; firm = 0; rewardKept = false; rewardShared = null;
    $('chat').replaceChildren(); lines = [];
    closeOverlay();
    renderTop(); renderFooter();
    sunnySays('hello_' + band).then(() => { if (token === roundId) ask(); });
  }

  async function ask() {
    const token = roundId;
    renderTop();
    if (i >= round.length) return finish();
    const item = round[i];
    await sunnySays('ask_' + item.id);
    if (token !== roundId) return;
    if (item.kind === 'safe') {
      replies([
        { label: () => t('answer_' + item.id), pick: () => answeredSafe(item, true) },
        { label: () => t('opt_keep'), pick: () => answeredSafe(item, false) }
      ]);
    } else if (item.kind === 'graded') {
      replies(shuffle([
        { label: () => t('share_first_name'), pick: () => firstName(item) },
        { label: () => t('share_name'), pick: () => shared(item, 'share_name') },
        { label: () => t('opt_keep'), pick: () => keptIt(item, 'keep', false) }
      ]));
    } else if (item.kind === 'grey') {
      replies(shuffle([
        { label: () => t('share_' + item.id), pick: () => answeredGrey(item, 'share') },
        { label: () => t('opt_keep'), pick: () => answeredGrey(item, 'keep') },
        { label: () => t('opt_grownup'), pick: () => answeredGrey(item, 'grownup') }
      ]));
    } else {
      offerSecret(item, false);
    }
  }

  function offerSecret(item, pushed) {
    replies(shuffle([
      { label: () => t('share_' + item.id), pick: () => shared(item) },
      { label: () => t('opt_keep'), pick: () => keptIt(item, 'keep', pushed) },
      { label: () => t('opt_grownup'), pick: () => keptIt(item, 'grownup', pushed) }
    ]));
  }

  async function shared(item, key = 'share_' + item.id) {
    const token = roundId;
    const reward = item.kind === 'reward';
    meSays(key);
    shields = Math.max(0, shields - 1);
    if (reward) rewardShared = item.id;
    renderTop();
    // A reward share is answered first: Sunny promises, then the coach asks whether it ever came.
    if (!reward) coach('bad', 'careful', item.kind === 'graded' ? 'why_name' : 'why_' + item.id);
    await wait(500);
    if (token !== roundId) return;
    await sunnySays(reward ? 'thanks_' + item.id : 'thanks_' + band);
    if (token !== roundId) return;
    if (reward) { coach('bad', 'careful', 'why_reward'); await wait(500); }
    if (token !== roundId) return;
    kidvo.emit('shared', { item: item.id });
    next();
  }

  async function keptIt(item, how, pushed) {
    const token = roundId;
    meSays(how === 'grownup' ? 'opt_grownup' : 'opt_keep');
    if (how === 'grownup') grownup++;
    if (!pushed && POOL[band].push.includes(item.id)) {
      await sunnySays('push_' + item.id);
      if (token !== roundId) return;
      offerSecret(item, true);
      return;
    }
    if (pushed) firm++;
    if (item.kind === 'reward') rewardKept = true;
    kept++;
    const title = pushed ? 'stoodFirm' : item.kind === 'reward' ? 'badge_notforsale' : 'wellKept';
    coach('good', title, item.kind === 'graded' ? 'why_first_name' : 'why_' + item.id);
    await wait(500);
    if (token !== roundId) return;
    await sunnySays(how === 'grownup' ? 'ok_grownup' : 'ok_keep');
    if (token !== roundId) return;
    kidvo.emit('kept', { item: item.id });
    next();
  }

  async function answeredSafe(item, answered) {
    const token = roundId;
    meSays(answered ? 'answer_' + item.id : 'opt_keep');
    coach('good', answered ? 'safeTitle' : 'safeKeepTitle', answered ? 'why_safe' : 'why_safekeep');
    await wait(500);
    if (token !== roundId) return;
    await sunnySays(answered ? 'thanks_safe' : 'ok_keep');
    if (token !== roundId) return;
    next();
  }

  // The graded name question: a first name is fine and counts as kept.
  async function firstName(item) {
    const token = roundId;
    meSays('share_first_name');
    kept++;
    coach('good', 'safeTitle', 'why_first_name');
    await wait(500);
    if (token !== roundId) return;
    await sunnySays('thanks_safe');
    if (token !== roundId) return;
    kidvo.emit('kept', { item: item.id });
    next();
  }

  // Grey questions have no shield: asking a grown-up is best, keeping it is fine, sharing earns a yellow note.
  async function answeredGrey(item, how) {
    const token = roundId;
    meSays(how === 'share' ? 'share_' + item.id : how === 'grownup' ? 'opt_grownup' : 'opt_keep');
    if (how === 'grownup') grownup++;
    if (how === 'share') coach('grey', 'greyTitle', 'why_' + item.id);
    else coach('good', how === 'grownup' ? 'bestCall' : 'safeKeepTitle', 'why_' + item.id);
    await wait(500);
    if (token !== roundId) return;
    await sunnySays(how === 'share' ? 'thanks_' + band : how === 'grownup' ? 'ok_grownup' : 'ok_keep');
    if (token !== roundId) return;
    next();
  }

  async function next() {
    const token = roundId;
    i++;
    await wait(900);
    if (token !== roundId) return;
    ask();
  }

  function finish() {
    clearReplies();
    busy(false);
    best = Math.max(best, kept);
    kidvo.store.set('best', best).catch(() => {});
    renderFooter();
    kidvo.emit('done', { kept, total, band });
    const earned = [];
    if (kept === total) earned.push('badge_keeper');
    if (grownup > 0) earned.push('badge_grownup');
    if (firm > 0) earned.push('badge_firm');
    if (rewardKept) earned.push('badge_notforsale');
    const promised = rewardShared;
    let answered = null;
    const view = () => {
      const card = el('div', 'card');
      card.append(el('h2', null, t('doneTitle')));
      const s = el('div', 'stat'); s.append(el('span', null, t('statKept')), el('span', null, t('ofTotal', { n: kept, total })));
      card.append(s);
      if (earned.length) { const e = el('div', 'earned'); for (const b of earned) e.append(el('span', null, t(b))); card.append(e); }
      card.append(el('p', null, t('reflect')));
      if (answered === null) {
        const row = el('div', 'row');
        for (const [label, val] of [[t('yes'), true], [t('no'), false]]) {
          const b = el('button', 'btn alt', label); b.type = 'button';
          b.addEventListener('click', () => { answered = val; showOverlay(view); });
          row.append(b);
        }
        card.append(row);
      } else {
        card.append(el('p', null, t(answered ? 'fb_yes' : 'fb_no')));
        if (promised) card.append(el('p', null, t('fb_' + promised)));
        card.append(el('p', 'rule', t('rule')));
        const again = el('button', 'btn', t('again')); again.type = 'button';
        again.addEventListener('click', start);
        card.append(again);
      }
      return card;
    };
    showOverlay(view);
  }

  function pickBand() {
    showOverlay(() => {
      const card = el('div', 'card');
      card.append(el('h2', null, t('who')), el('p', 'note', t('whoNote')));
      for (const key of Object.keys(POOL)) {
        const b = el('button', 'btn alt'); b.type = 'button';
        b.append(el('span', null, t('band_' + key)), el('small', null, t('ages', { ages: POOL[key].ages })));
        b.addEventListener('click', () => { band = key; kidvo.store.set('band', key).catch(() => {}); start(); });
        card.append(b);
      }
      return card;
    });
  }

  function showOverlay(view) {
    overlayView = view;
    $('overlay').replaceChildren(view());
    $('overlay').hidden = false;
    const card = $('overlay').querySelector('.card');
    if (card) { card.tabIndex = -1; card.focus({ preventScroll: true }); }
  }
  function closeOverlay() { overlayView = null; $('overlay').hidden = true; }

  $('change-band').addEventListener('click', pickBand);
  // "start over" needs two taps, so a younger sibling cannot wipe progress by accident (as in Robot Maze).
  $('reset').addEventListener('click', () => {
    if (!resetArmed) {
      resetArmed = true; renderFooter();
      resetTimer = setTimeout(() => { resetArmed = false; renderFooter(); }, 3000);
      return;
    }
    clearTimeout(resetTimer); resetArmed = false;
    roundId++; // stops a chat that is still typing
    clearReplies();
    best = 0; band = null; round = []; i = 0; total = 0; shields = 0;
    kidvo.store.remove('best').catch(() => {});
    kidvo.store.remove('band').catch(() => {});
    $('chat').replaceChildren(); lines = [];
    busy(false);
    renderTop(); renderFooter();
    pickBand();
  });
  kidvo.onLang(() => {
    renderTop(); renderFooter();
    for (const draw of lines) draw();
    if (currentReplies) drawReplies();
    if (overlayView && !$('overlay').hidden) $('overlay').replaceChildren(overlayView());
  });

  // Test hook for the automated browser test only.
  if (navigator.webdriver) window.__secretKeeper = {
    state: () => ({ i, kept, shields, total, done: i >= round.length, kinds: round.map(r => r.kind), ids: round.map(r => r.id) }),
    begin: b => { band = b; start(); }
  };

  pickBand();
  kidvo.ready(async () => {
    try {
      best = (await kidvo.store.get('best')) || 0;
      renderFooter();
      const saved = await kidvo.store.get('band');
      if (saved && POOL[saved]) { band = saved; start(); }
    } catch { /* first visit */ }
  });
})();
