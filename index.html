<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kidvo</title>
<meta name="description" content="Free games that help kids aged 7 to 13 use AI wisely while thinking for themselves. No real AI, no tracking, open source.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'">
<link rel="icon" href="shell/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="shell/shell.css">
</head>
<body>
<header id="topbar">
  <span class="tb-brand"><img src="shell/logo.svg" alt="" width="18" height="18">kidvo</span>
  <span id="motto" data-i18n="motto"></span>
  <div id="lang" role="group"></div>
</header>

<main id="desktop" aria-label="kidvo">
  <div id="icons" role="list" aria-label="Apps"></div>
  <div id="windows"></div>
  <div id="overlays" aria-hidden="true"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
</main>

<div id="start-menu" hidden role="menu" aria-label="Start menu">
  <div class="sm-head">
    <img src="shell/logo.svg" alt="" width="40" height="40">
    <div>
      <div class="sm-brand">kidvo</div>
      <div class="sm-tag" data-i18n="tagline"></div>
    </div>
  </div>
  <div class="sm-apps" id="sm-apps"></div>
  <div class="sm-stats" id="sm-stats"></div>
  <div class="sm-foot">
    <button type="button" class="sm-link" data-shell="about" data-i18n="menuAbout"></button>
    <button type="button" class="sm-link" data-shell="grownups" data-i18n="menuGrownups"></button>
    <button type="button" class="sm-link sm-build" data-shell="build" data-i18n="menuBuild"></button>
  </div>
</div>

<nav id="taskbar" aria-label="Taskbar">
  <button type="button" id="start-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="start-menu">
    <img src="shell/logo.svg" alt="" width="20" height="20"><span>kidvo</span>
  </button>
  <div id="task-list"></div>
  <div id="tray">
    <div id="tray-overlays"></div>
    <time id="clock"></time>
  </div>
</nav>

<script src="shell/config.js"></script>
<script src="shell/i18n.js"></script>
<script src="apps/registry.js"></script>
<script src="shell/shell.js"></script>
</body>
</html>
